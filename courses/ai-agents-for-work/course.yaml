# =============================================================================
# Single source of truth for course #3.
# STATUS: scaffolded from 2026 demand research (agents / no-code automation is
# the top learning demand; n8n the leading tool). The writer session may adjust
# lecture grain within sections; sections and positioning are settled.
# Positioning note: docs/00-strategy.md ranked generic "AI productivity" last,
# and that judgement stands. This course escapes the commodity zone the same
# way courses #1 and #2 did: a judgement spine (agents are onboarded like
# employees, not installed like apps) that a tool tour cannot copy, plus
# exportable working agents as artifacts. Visual standard: docs/09; this is
# the most screenshot-heavy course in the portfolio by design.
# =============================================================================

slug: ai-agents-for-work
title: "AI Agents for Your Job: Automate Real Office Work, No Code Required"
subtitle: >-
  Build agents that triage your inbox, draft your reports and chase your
  invoices, using n8n and the AI of your choice. Then learn the part no tool
  course teaches: checking their work, setting guardrails, and knowing what
  never to automate.

# --- Landing page -----------------------------------------------------------
description: |
  **You keep hearing that AI agents will change office work. Nobody shows you
  how to get one doing YOUR work, safely, this week.** That is what this
  course does.

  You will build four working agents for the tasks that actually eat your
  week: inbox triage, meeting notes into action items, the weekly report,
  and follow-ups that never slip. All in n8n, the leading open-source
  automation tool, with the AI model of your choice plugged in. Every build
  is shown screen by screen, and every agent you build is also provided as a
  downloadable template you can import and adapt in minutes.

  Then the part that separates people who run agents from people who clean
  up after them: how to onboard an agent like an employee rather than
  install it like an app. A job description before it starts. A trial task
  before you trust it. Spot checks that catch its failure modes early.
  Guardrails and approval steps so a mistake stays small. And an honest map
  of the tasks you should never hand over at all.

  **You will build 10 artifacts you can use immediately**, including four
  importable agent workflow templates, an agent job-description template, a
  trial-task checklist, a spot-check rubric, a guardrails worksheet, a
  running-cost tracker, and a one-page rollout plan for your team.

  **Who this is for:** office workers, managers, ops and admin professionals
  who want real hours back. No code anywhere in the course.

  **What this is not:** a tool tour that ages in a quarter, or a hype reel.
  Every technique names its cost, every agent gets checked before it gets
  trusted, and the course tells you plainly where automation is the wrong
  answer.

  This course contains the use of artificial intelligence.

# --- Positioning ------------------------------------------------------------
big_idea: >-
  An agent is an employee, not an app. You do not install it, you onboard it:
  job description first, trial task next, spot checks always, trust only as
  it is earned, and a blast radius you chose before it acts. Tools change
  quarterly; onboarding judgement is permanent.

audience:
  - Office workers and managers drowning in repetitive admin
  - Ops, admin and customer-facing professionals who own recurring processes
  - Team leads asked to "look into AI" with no budget for engineers
  - Freelancers running their own back office

prerequisites:
  - Comfort using web apps; no code anywhere in the course
  - A task you do every week and would rather not
  - "Some builds use paid AI credits; the course shows free-tier routes first"

outcomes:
  - "Build and import four working agents: inbox triage, meeting notes, weekly report, follow-ups"
  - "Write an agent job description that turns a vague wish into a delegable task"
  - "Run a trial task and spot checks that catch an agent's failure modes before they cost you"
  - "Set guardrails, approval gates and blast radius so mistakes stay small"
  - "Track what an agent costs and saves, honestly, and present it to your boss"
  - "Recognise the tasks that should never be automated, and say why with confidence"

