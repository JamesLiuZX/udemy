    established: "0.4"
    meaning: "Brightwell Manufacturing Ltd's annual premium, property and liability"
  - value: "15 September"
    established: "0.4"
    meaning: "Brightwell's renewal date"
  - value: "40"
    established: "0.4"
    meaning: "Promotional and internal emails burying Brightwell's query in Priya's inbox"
  - value: "6 days"
    established: "0.4"
    meaning: "How long Brightwell's query sat unread before the triage agent existed"
  - value: "41"
    established: "0.1"
    meaning: "Mid-market accounts on Priya's own renewals book"
  - value: "180"
    established: "0.1"
    meaning: "Staff at Calloway & Finch"
  - value: "two weeks"
    established: "7.1"
    meaning: "Length of Priya's trial period for a new agent before she trusts it unsupervised"
  - value: "~4.0 hours"
    established: "9.3"
    meaning: "Net weekly hours saved across all four agents, cleanly counted (checking time subtracted)"
  - value: "under $5"
    established: "9.3"
    meaning: "Combined monthly AI cost for all four of Priya's agents"
