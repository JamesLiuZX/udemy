slug: ai-for-pms
title: "AI Product Skills for PMs & Analysts: Spec, Evaluate & Ship AI Features"
subtitle: >-
  Stop guessing whether your AI feature works. Learn to write eval-based acceptance
  criteria, build a golden-set eval harness, model token economics, and de-risk
  hallucination: the judgement work that survives every model upgrade.

# --- Landing page -----------------------------------------------------------
# Paste verbatim into the Udemy course description. The AI disclosure MUST stay
# as the final line — qc.py fails the build if it is missing or moved.
description: |
  **You're accountable for an AI feature you're not sure how to judge.** That is
  the actual problem this course solves.

  Everything you learned about shipping software assumes it behaves the same way
  twice. AI features don't. Same input, different output, so your acceptance
  criteria stop working, QA passes things that fail in production, and quality
  arguments get settled by whoever is most senior rather than by evidence.

  This course gives you the judgement work that doesn't disappear when the next
  model ships. You'll learn to write acceptance criteria as evaluation thresholds
  on a golden dataset, build an eval harness (in a spreadsheet and in 30 lines of
  Python), design and defend a RAG system, model what a feature costs per user at
  scale, scope agents with reliability maths instead of optimism, and run a
  red-team pass that gets you through legal review.

  **You will build 12 artifacts you can use at work immediately:** an AI Feature
  PRD, a golden dataset spec, two eval harnesses, a scoring rubric with a
  calibration protocol, a RAG design doc, a retrieval scorecard, an agent scoping
  worksheet, a token unit-economics model, a model selection scorecard, an AI
  risk register, and a metric tree for the numbers that matter after launch.

  **Who this is for:** product managers, project and delivery managers, and
  business or data analysts who are now responsible for AI work. No coding
  required: the one Python lecture is explained line by line.

  **What this is not:** a prompt library, a tour of this month's tools, or a
  course you could replace with an afternoon of ChatGPT. It's process and
  judgement, taught through work you actually do.

  This course contains the use of artificial intelligence.

# --- Positioning ------------------------------------------------------------
big_idea: >-
  An AI feature is a probability distribution, not a function. You cannot write
  acceptance criteria for it the way you write them for a button. You write them as
  evaluation thresholds on a golden dataset.

audience:
  - Product managers accountable for an AI feature they feel unqualified to judge
  - Project / delivery managers running AI workstreams
  - Business & data analysts asked to measure AI systems
  - Founders and consultants scoping AI work

prerequisites:
  - No coding required. One optional Python lecture, fully explained line by line.
  - Comfort with spreadsheets.
  - Some exposure to product or delivery work.

outcomes:              # keep to 4-7; too many correlates with lower course scores
  - "Write an AI feature PRD whose acceptance criteria are eval thresholds, not wishes"
  - "Build a golden-set evaluation harness in a spreadsheet and in 30 lines of Python"
  - "Design and defend a RAG system in an architecture review"
  - "Model the token-level unit economics of an AI feature and spot the margin trap"
  - "Scope agents safely using reliability maths and blast-radius analysis"
  - "Run a red-team pass and produce an AI risk register your legal team accepts"

