# Facts registry: decay-prone claims across the whole portfolio.
#
# Powers the freshness sentinel (growth/prompts/freshness-sentinel.md). One
# entry per claim that could plausibly go stale within 6-12 months: model
# names, prices, context windows, rate limits, tool/product capabilities,
# platform policies, "as of <date>" statements, and statistics tied to a
# named study or report. Timeless claims (general product philosophy,
# psychological mechanisms stated without a decaying number) are
# deliberately left out.
#
# Course entries use `lecture: "<section>.<number>"` (matches the lecture id
# in courses/<slug>/lectures/). Book entries use `chapter: "<book-slug>/<NN>"`
# (matches the two-digit chapter file in books/<slug>/manuscript/). `source`
# is the URL or citation the lecture/chapter itself names, or `null` if it
# states the claim without a checkable link (never invent one). `checked` is
# the date this entry was last verified against source; the freshness
# sentinel job updates it going forward.
#
# Built 2026-08-12 by a full first-pass scan of all three courses' lecture
# files and all seven books' English manuscripts (courses/ have no separate
# translation; the Chinese book editions are translations of the same
# claims, so are not re-registered separately here — a claim that changes in
# the English source is the same claim in zh and needs the same re-verify).
# Every entry below is freshly registered, not yet independently checked
# against a live source: `checked: "2026-08-12"` records when it was found
# and logged, not when it was confirmed accurate. The freshness sentinel's
# next run is the first real verification pass.

