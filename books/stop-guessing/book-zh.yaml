style:
  spellcheck_lang: en_US   # placeholder: qc.py's spellcheck is en_US-only and
                            # gracefully no-ops without hunspell; not meaningful
                            # for Chinese text, kept only so qc.py doesn't error
                            # reading a missing key. Matches the convention in
                            # books/one-person-business/book-zh.yaml.
  em_dash: avoid  # Same repo-wide convention as every other book, including
                  # the other two Chinese editions (ai-employee-zh,
                  # one-person-business-zh): a single em dash used as 破折号
                  # is legitimate Chinese punctuation, but this translation
                  # was written around it entirely, using colons, commas, and
                  # restructured sentences instead, so the gate applies
                  # unweakened here too.

# Listing copy for the actual distribution channels (not KDP). Not part of
# the interior PDF.
description: |
  你正为一个自己都说不准好不好用的AI功能负责。过去那套验收标准，假设系统每次
  都会给出同样的结果。可AI不是这样，于是你的验收标准失灵了，测试通过的功能照
  样在生产环境翻车，质量争议最后靠职位最高的人一锤定音，而不是靠证据。

  这本书教你的判断力，不会随着模型升级而过时：把验收标准写成可衡量的评测阈值
  （evaluation threshold），而不是模糊的"通过/不通过"；建一套你能拿出来站得
  住脚的评测集（golden set）；在功能上线前，而不是账单寄来后，把成本算清楚；
  用可靠性数学而不是盲目乐观去限定智能体（agent）的权限范围；建一份能顺利通
  过法务审查、而不是被卡住的风险登记表（risk register）。

  写给现在要为AI相关工作负责、却没有工程背景的产品经理、交付负责人和分析师。

dedication: "献给所有在有人追问“它到底有没有效”之前，就已经把功能上线的人。"

