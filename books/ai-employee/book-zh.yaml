# =============================================================================
# Simplified Chinese (zh-CN) edition of "Your First AI Employee".
# Sibling config to book.yaml, not a variant of it: same design system, same
# four bracket devices, same qc.py/build.py pipeline, but a distinct slug
# (own build/ output dir, own proofs/ file) and its own manuscript-zh/ and
# back-matter-zh/ source trees. See notes.md for the full status record and
# for why this edition does not target KDP (KDP does not accept a Simplified
# Chinese paperback upload; see notes.md's citations).
# =============================================================================

slug: ai-employee-zh
title: "你的第一位AI员工"
subtitle: "如何把真实工作交给AI，检查它的产出，并知道何时该“解雇”它"
author: "James Liu"
year: 2026
genre: business
trim: "6x9"
target_pages: [150, 190]
lang: zh

# Never set true except by the real author, after a genuine full read-through
# of THIS edition (a sign-off on the English edition does not carry over).
verified: false

# Chinese versions of the copyright-page text. Without these, build.py falls
# back to its English DEFAULT_RIGHTS_NOTE/DEFAULT_AI_DISCLOSURE/DEFAULT_ISBN_NOTE
# constants, which is wrong for this edition -- ai_disclosure_text especially,
# since it is the compliance-critical AI-assistance disclosure line books/
# CLAUDE.md SS1 requires, and it has to actually be readable by this book's
# reader, not silently left in English.
rights_note: "保留所有权利。未经作者事先书面许可，不得以任何形式复制、分发或传播本书的任何部分，书评中引用的简短片段除外。"
ai_disclosure_text: "本书在作者的指导、大纲设计与审阅下，借助AI辅助撰写完成。书中统计数据与案例研究均引自已标注来源的公开资料；任何关于亲身经历的表述均为作者本人的真实经历。"
isbn_note: "ISBN：[发行前由出版方或平台指定]"

style:
  spellcheck_lang: zh_CN
  em_dash: avoid

# back-matter-zh/ is picked up automatically by build.py's back-matter-<lang>
# convention (no field needed for that); this overrides the printed section
# titles, which otherwise default to the English titles dict.
back_matter_titles:
  notes_and_sources: "说明与资料来源"
  about_the_author: "关于作者"

# Not KDP listing copy (this edition isn't a KDP upload) -- kept for other
# storefronts (Google Play Books, Apple Books) and direct/lead-gen use.
description: |
  你不需要成为技术专家，就能真正从AI身上获得杠杆效应。你需要的是管理它，
  就像管理一位反应迅速、渴望表现、偶尔又过度自信的新员工一样：给它一份
  真正的工作说明，而不是一句含糊的请求；仔细检查它最初几次的成果；摸清
  它到底会在哪里出错；并清楚哪些任务永远不该交给它。

  这是一套实用的、不依赖具体工具的方法，教你把真实的工作一项一项交给AI
  处理，从周二下午那件已经拖了很久的任务开始。书中没有功能导览，也没有
  任何会在某个应用改版之后就过时的内容。它讲的是这套管理技能本身，而这
  项技能不会因工具更新而改变。

  写给每一个手头有重复性工作、又不想再听炒作、也不想再翻四十个浏览器标
  签页去看"最佳AI工具"榜单的人。

dedication: "献给每一个仍未清空的收件箱。"

front_matter:
  - half_title
  - title_page
  - copyright
  - dedication
  - toc

