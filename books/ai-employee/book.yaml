# interface.
# =============================================================================

slug: ai-employee
title: "Your First AI Employee"
subtitle: "How to Delegate Real Work to AI, Check Its Output, and Know When to Fire It"
author: "Your Name"
year: 2026
genre: business
trim: "6x9"
target_pages: [180, 240]

# Never set true except by the real author, after a genuine full read-through.
verified: false

style:
  spellcheck_lang: en_US
  em_dash: avoid

# KDP listing copy. Not part of the interior PDF.
description: |
  You don't need to become technical to get real leverage from AI. You need
  to manage it, the way you'd manage a fast, eager, occasionally
  overconfident new hire: give it a real job description instead of a vague
  request, check its first attempts closely, learn exactly how it fails,
  and know which tasks it should never touch.

  This is a practical, tool-agnostic system for delegating real work to AI,
  one task at a time, starting with the one already eating your Tuesday
  afternoon. No feature tours, nothing that goes stale the next time an
  app redesigns its interface. Just the management skill underneath it,
  which doesn't change when the tools do.

  Written for anyone with a repetitive task and no patience left for either
  hype or a 40-tab browser of "best AI tools" listicles.

dedication: "For every inbox that's still full."

