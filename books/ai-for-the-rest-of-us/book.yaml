# =============================================================================
# Single source of truth for "AI for the Rest of Us".
# Practical / workflow book for non-technical adults: everyday tasks, not
# productivity-hacking. Plain English throughout, no jargon tolerance.
# =============================================================================

slug: ai-for-the-rest-of-us
title: "AI for the Rest of Us"
subtitle: "The Plain-English Guide to Getting Real Help From AI, No Tech Background Required"
author: "James Liu"
year: 2026
genre: business
trim: "6x9"
target_pages: [180, 240]

# Never set true except by the real author, after a genuine full read-through.
verified: false

style:
  spellcheck_lang: en_US
  em_dash: avoid

# KDP listing copy. Not part of the interior PDF.
description: |
  You don't think of yourself as a tech person, and every AI guide you've
  opened so far was written by someone who forgot what that felt like.
  This one wasn't.

  No prompt engineering, no jargon, no seventeen-tab comparison of apps you've
  never heard of. Just plain help with the things actually on your plate:
  planning a trip you haven't had time to think about, writing the letter
  you've been avoiding, helping with homework without doing it for your
  kid, walking into a doctor's appointment with the right questions,
  making sense of a bill, and knowing the difference between AI being
  wrong and AI being used against you.

  Written for the people every family already calls when the wifi breaks,
  except this time the answer isn't "let me look at it," it's a book they
  can hand over instead.

dedication: "For everyone who closed the tab because they didn't know what to type."

front_matter:
  - half_title
  - title_page
  - copyright
  - dedication
  - toc

