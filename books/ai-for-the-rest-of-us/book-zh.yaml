# =============================================================================
# Simplified Chinese edition of "AI for the Rest of Us".
# Separate book.yaml (own slug, own build output dir) rather than a field
# inside the English book.yaml, so `build.py --book books/ai-for-the-rest-of-us/
# book-zh.yaml` builds this edition without touching the English path at all.
# Mirrors the English book.yaml structurally; every value below is the
# Chinese equivalent of that file's field, not a re-derivation.
# =============================================================================

slug: ai-for-the-rest-of-us-zh
title: "写给普通人的 AI"
subtitle: "零技术基础也能看懂的大白话指南，教你如何真正从 AI 那里获得帮助"
author: "James Liu"
year: 2026
genre: business
trim: "6x9"
target_pages: [140, 190]
lang: zh

# Never set true except by the real author, after a genuine full read-through.
verified: false

style:
  spellcheck_lang: en_US   # hunspell has no useful CJK dictionary here; see notes.md
  em_dash: avoid

# Not part of the interior PDF. Not a KDP listing either -- KDP does not
# accept a Chinese-language paperback at all, and does not list Simplified
# Chinese as a supported eBook language (only Traditional Chinese, in beta,
# ebook-only). This edition targets Google Play Books, Apple Books, and
# direct/lead-gen distribution instead. See notes.md for what was checked.
description: |
  你从不觉得自己是「懂技术的人」，而你翻过的每一本 AI 指南，写书的人似乎都已经
  忘了那种感觉。这一本不一样。

  没有提示词工程，没有行话，也不会让你对着十七个从没听过的应用软件挨个比较。
  这本书只谈你手头真正要处理的事：一趟你一直没空细想的旅行，一封你迟迟不敢
  写的信，帮孩子写作业却不替他写完，带着正确的问题走进诊室，看懂一张让人头
  疼的账单，还有分清「AI 说错了」和「AI 被人用来害你」这两件完全不同的事。

  写给每个家里网络一出问题就会被叫去帮忙的那个人。只是这一次，答案不再是
  「我去看看」，而是一本可以直接递过去的书。

dedication: "献给每一个因为不知道该打什么字，而关掉了那个页面的人。"

rights_note: "版权所有，未经作者书面许可，不得以任何形式复制、发行或传播本书的任何部分，书评中的简短引用除外。"
ai_disclosure_text: "本书在作者的指导、大纲规划与审阅下，借助 AI 辅助完成写作。书中数据与案例均引自已标注来源的公开资料；任何涉及个人经历的表述均为作者本人真实经历。"
isbn_note: "ISBN：[将在正式发行时分配]"

