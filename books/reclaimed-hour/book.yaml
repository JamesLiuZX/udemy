# KDP listing copy. Not part of the interior PDF.
description: |
  Every "AI productivity" book on the shelf is quietly a hustle book: use
  AI to do more, ship more, output more, in the same or fewer hours. This
  isn't that book, and if that's what you're looking for, it will
  disappoint you on purpose.

  This book starts from a different, more honest observation: most people
  who automate a task with AI don't actually get the hour back. They fill
  it with something else, usually more work, because reclaiming time
  turns out to be a behavioral problem wearing a technical costume. This
  book is about the actual behavioral work: finding the hour, sitting
  with the discomfort of having it, protecting it from being recolonized,
  and using it for whatever you actually wanted it for in the first
  place, before you forgot to ask.

  Written for anyone who has automated a task, felt briefly relieved, and
  then noticed the relief evaporate within a week because something else
  expanded to fill the space.

dedication: "For the hour you keep meaning to get back."

