# =============================================================================
# Single source of truth for "The Resume Arms Race".
# Domain-specific book for recruiters and talent acquisition professionals:
# AI-written resumes on one side, AI-powered screening on the other, and how
# a recruiter stays useful and fair caught in the middle.
# =============================================================================

slug: resume-arms-race
title: "The Resume Arms Race"
subtitle: "How Recruiters Stay Useful and Fair When Every Resume Is AI-Written and Every Screen Is AI-Powered"
author: "James Liu"
year: 2026
genre: business
trim: "6x9"
target_pages: [120, 170]

# Never set true except by the real author, after a genuine full read-through.
verified: false

style:
  spellcheck_lang: en_US
  em_dash: avoid

# KDP listing copy. Not part of the interior PDF.
description: |
  Every resume in your queue reads a little too well now, and the tool
  you're using to screen them was built by the same kind of technology
  that wrote them. Something in the middle, the actual signal about
  whether this person can do this job, is getting crushed between the
  two, and nobody trained you for what to do about it.

  This book is a practical answer, not a lament. It covers what AI
  screening actually gets wrong and who it wrongly filters out, how to
  read past a fluent resume to the real signal underneath, why the
  interview just became the most important tool you have, how to write
  job posts that select for fit instead of keyword-matching, the bias and
  liability exposure nobody's talent acquisition training covered, and
  how to build a hiring process you could defend in front of a regulator
  or a rejected candidate's lawyer.

  Written for recruiters and talent acquisition professionals who didn't
  sign up to referee an arms race, but are the ones standing in the
  middle of it regardless.

dedication: "For every good candidate a keyword filter never saw."

