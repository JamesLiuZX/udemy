# Simplified Chinese edition of "AI Didn't Close That Deal".
# Separate book.yaml (own slug, own build output dir) rather than a field
# inside the English book.yaml, so `build.py --book books/ai-didnt-close-
# that-deal/book-zh.yaml` builds this edition without touching the English
# path at all. Mirrors the English book.yaml structurally; every value below
# is the Chinese equivalent of that file's field, not a re-derivation.
# =============================================================================

slug: ai-didnt-close-that-deal-zh
title: "这一单，AI 拿不下"
subtitle: "销售负责人如何穿透 AI 生成的外联噪音，让团队的邮件重新获得回复"
author: "James Liu"
year: 2026
genre: business
trim: "6x9"
target_pages: [140, 210]
lang: zh

# Never set true except by the real author, after a genuine full read-through.
verified: false

style:
  spellcheck_lang: en_US   # hunspell has no useful CJK dictionary here; see notes.md
  em_dash: avoid

# Not part of the interior PDF. Not a KDP listing either -- KDP does not
# accept a Chinese-language paperback at all, and does not list Simplified
# Chinese as a supported eBook language (only Traditional Chinese, in beta,
# ebook-only). This edition targets Google Play Books, Apple Books, and
# direct/lead-gen distribution instead. See notes.md for what was checked.
description: |
  每一位潜在客户的收件箱里，都堆满了千篇一律的 AI 生成销售邮件，包括，说句
  实话，你团队发出的一部分邮件。回复率正在全线下滑，而"发得更多"这个本能反
  应，恰恰就是造成这个问题的原因。

  这本书为销售负责人和他们带领的团队提供了一套务实的重启方案：为什么"发送
  量"在变得免费的那一刻就不再是一种有效策略；如何做 AI 生成模板做不出来的
  那种真正的研究；如何在不牺牲本季度业绩数字的前提下，帮团队戒掉"广撒网"
  的习惯；AI 到底在哪些地方真正能帮到销售代表；以及如何解读那些真正预测营
  收的指标，而不是那些只是看起来有成效的指标。

  写给那些希望团队的外联邮件重新被人认真阅读的销售负责人，而不是又一个承
  诺"发得更快"的工具。

dedication: "献给每一位好邮件被埋没在成千上万封烂邮件之下的销售代表。"

