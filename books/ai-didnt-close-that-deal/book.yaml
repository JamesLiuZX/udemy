# =============================================================================
# Single source of truth for "AI Didn't Close That Deal".
# Domain-specific book for sales leaders: reply rates cratering because
# every inbox is full of AI-generated pitches, and how to stand out and
# coach a team off the habit that stopped working.
# =============================================================================

slug: ai-didnt-close-that-deal
title: "AI Didn't Close That Deal"
subtitle: "How Sales Leaders Cut Through AI-Generated Noise and Actually Get Replies"
author: "James Liu"
year: 2026
genre: business
trim: "6x9"
target_pages: [180, 240]

# Never set true except by the real author, after a genuine full read-through.
verified: false

style:
  spellcheck_lang: en_US
  em_dash: avoid

# KDP listing copy. Not part of the interior PDF.
description: |
  Every prospect's inbox is drowning in AI-generated pitches that all sound
  the same, including, if you're honest, some of yours. Reply rates are
  falling across the board, and the instinct to fix it by sending more
  is exactly the instinct that caused the problem.

  This book is a practical reset for sales leaders and the teams they run:
  why volume stopped being a strategy the moment it became free, how to
  do the kind of research an AI-generated template can't fake, how to
  coach a team off spray-and-pray without losing their pipeline numbers
  in the process, where AI still genuinely helps a rep, and how to read
  the metrics that actually predict revenue instead of the ones that just
  feel productive.

  Written for sales leaders who need their team's outreach to actually get
  read again, not another tool promising to send more of it faster.

dedication: "For every rep whose good email got buried under a thousand bad ones."

