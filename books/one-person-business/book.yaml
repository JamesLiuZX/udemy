# =============================================================================
# Single source of truth for "The One-Person Business's AI Stack".
# Practical / workflow book for freelancers and solopreneurs: automating
# the admin around the work, never the work itself.
# =============================================================================

slug: one-person-business
title: "The One-Person Business's AI Stack"
subtitle: "How Freelancers and Solopreneurs Use AI to Handle the Admin So They Can Do the Work They're Actually Paid For"
author: "James Liu"
year: 2026
genre: business
trim: "6x9"
target_pages: [120, 150]

# Never set true except by the real author, after a genuine full read-through.
verified: false

style:
  spellcheck_lang: en_US
  em_dash: avoid

# KDP listing copy. Not part of the interior PDF.
description: |
  You didn't start a one-person business to become an invoicing clerk,
  a part-time contract lawyer, and an unpaid bookkeeper. But somewhere
  between the client work and the actual craft, that's most of what the
  job quietly turned into.

  This book builds a real stack, not a single silver-bullet app, for the
  admin that eats a solo business alive: proposals that used to take an
  evening, invoices that used to sit unsent, the contract clause that
  protects you from scope creep, the bookkeeping you've been avoiding,
  and the marketing you never have energy left for by Friday. Every
  chapter ends with something you actually build that week, not a
  concept to think about later.

  Written for freelancers, consultants, and solo agency owners who got
  into this to do the work, not to run its back office.

dedication: "For every invoice sitting in drafts."

